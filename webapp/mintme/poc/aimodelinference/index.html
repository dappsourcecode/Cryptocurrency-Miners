<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebLLM Local Browser Chat</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        #status { padding: 10px; background: #f0f0f0; border-radius: 5px; font-weight: bold; font-size: 0.9em;}
        #chat-box { min-height: 100px; margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; white-space: pre-wrap; background: #fafafa;}
        input { width: calc(100% - 100px); padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🧠 Pure Browser AI (No Server)</h2>
    <div id="status">Waiting to initialize...</div>
    
    <div style="margin-top: 20px;">
        <input type="text" id="prompt" value="Explain quantum computing in one simple sentence." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <div id="chat-box">The AI's response will appear here...</div>

    <!-- We use type="module" to allow ES6 imports directly in the browser -->
    <script type="module">
        // Import WebLLM directly from the esm.run CDN
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const statusEl = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const promptInput = document.getElementById("prompt");
        const sendBtn = document.getElementById("send-btn");

        // We use a very lightweight Llama 3.2 (1 Billion parameters) quantized for the web
        const selectedModel = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
        let engine;

        async function initializeAI() {
            try {
                // Initialize the engine and pass a callback to track the download progress
                engine = await CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => {
                        statusEl.textContent = `Loading Model: ${progress.text}`;
                    }
                });
                
                statusEl.textContent = "✅ Model Loaded! Running entirely on your GPU.";
                statusEl.style.background = "#d4edda";
                promptInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusEl.textContent = `❌ Error: ${error.message}`;
                statusEl.style.background = "#f8d7da";
            }
        }

        sendBtn.addEventListener("click", async () => {
            const text = promptInput.value;
            if (!text) return;

            // Disable inputs while generating
            promptInput.disabled = true;
            sendBtn.disabled = true;
            chatBox.textContent = "Thinking...\n\n";

            // The API perfectly mimics OpenAI's Chat Completions API
            const chunks = await engine.chat.completions.create({
                messages: [{ role: "user", content: text }],
                temperature: 0.7,
                stream: true, // Enable streaming so text types out live
            });

            let reply = "";
            for await (const chunk of chunks) {
                // Extract the streaming text token by token
                reply += chunk.choices[0]?.delta.content || "";
                chatBox.textContent = reply;
            }

            promptInput.disabled = false;
            sendBtn.disabled = false;
        });

        // Start downloading the model as soon as the page loads
        initializeAI();
    </script>
</body>
</html>
